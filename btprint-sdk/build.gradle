import com.vanniktech.maven.publish.SonatypeHost

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.vanniktech.maven.publish' version '0.32.0'
}

// 发布坐标系：io.github.jicg:btprint-sdk（Maven Central）
// 版本号只需改这里，coordinates 自动引用，避免两处硬编码错位
group = 'io.github.jicg'
version = '1.0.1'

android {
    namespace 'com.jicg.btprint'
    compileSdk 34

    defaultConfig {
        minSdk 21
        consumerProguardFiles 'proguard-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose false
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // 使用 api 暴露公共 API 依赖，保证宿主可访问 BtPrintActivity 等公开类型
    api "androidx.core:core-ktx:1.12.0"
    api "androidx.activity:activity-ktx:1.8.0"
    api "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}

// Maven Central 发布配置（central.sonatype.com，新账号统一走 Central Portal）
mavenPublishing {
    coordinates(project.group.toString(), 'btprint-sdk', project.version.toString())
    publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL)
    signAllPublications()
    pom {
        name = 'btprint-sdk'
        description = '基于 Android + Kotlin 的蓝牙热敏打印机 SDK，提供完整的 ESC/POS 打印能力'
        url = 'https://github.com/jicg/btprint-android'
        licenses {
            license {
                name = 'MIT'
                url = 'https://opensource.org/licenses/MIT'
            }
        }
        developers {
            developer {
                id = 'jicg'
                name = 'jicg'
                url = 'https://github.com/jicg'
            }
        }
        scm {
            connection = 'scm:git:git@github.com:jicg/btprint-android.git'
            developerConnection = 'scm:git:ssh://git@github.com:jicg/btprint-android.git'
            url = 'https://github.com/jicg/btprint-android'
        }
    }
}
